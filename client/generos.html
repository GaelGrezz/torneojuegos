<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Torneo Videojuegos - Catálogo de Géneros</title>
    <link rel="stylesheet" href="/src/index.css" />
  </head>
  <body>
    <div class="app">
      <!-- Sidebar con Enlaces HTML Nativos -->
      <nav class="sidebar">
        <a href="index.html" class="sidebar-tab" title="Dashboard">
          <span class="sidebar-tab-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="3" width="7" height="9" rx="1.5" />
              <rect x="14" y="3" width="7" height="5" rx="1.5" />
              <rect x="14" y="12" width="7" height="9" rx="1.5" />
              <rect x="3" y="16" width="7" height="5" rx="1.5" />
            </svg>
          </span>
        </a>

        <a href="videojuegos.html" class="sidebar-tab" title="Videojuegos">
          <span class="sidebar-tab-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M6 9h4M8 7v4" />
              <circle cx="16.5" cy="8.5" r="0.9" fill="currentColor" stroke="none" />
              <circle cx="18.5" cy="10.5" r="0.9" fill="currentColor" stroke="none" />
              <path d="M7.5 6h9a4 4 0 0 1 4 4.2l-.4 4.6a2.6 2.6 0 0 1-4.6 1.5L14 14.5a2 2 0 0 0-1.6-.8h-.8a2 2 0 0 0-1.6.8l-1.5 1.8a2.6 2.6 0 0 1-4.6-1.5l-.4-4.6A4 4 0 0 1 7.5 6Z" />
            </svg>
          </span>
        </a>

        <a href="generos.html" class="sidebar-tab active" title="Géneros">
          <span class="sidebar-tab-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M4 6h16M4 12h10M4 18h14" />
            </svg>
          </span>
        </a>

        <a href="jugadores.html" class="sidebar-tab" title="Jugadores">
          <span class="sidebar-tab-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="9" cy="8" r="3" />
              <path d="M3.5 20a5.5 5.5 0 0 1 11 0" />
              <path d="M16 8.5a2.8 2.8 0 1 1 0 5.6" />
              <path d="M15.5 14.3c2.4.4 4 2.2 4.5 5.2" />
            </svg>
          </span>
        </a>
      </nav>

      <!-- Contenido Principal: Página Géneros -->
      <main class="app-content">
        <section class="page">
          <div class="page-header">
            <div>
              <h1>Catálogo de Géneros</h1>
              <p class="section-subtitle">Gestiona las categorías independientes para los videojuegos</p>
            </div>
            <button class="btn btn-primary" id="btn-open-create-genero">+ Crear género</button>
          </div>

          <div id="generos-table-container"></div>
        </section>
      </main>
    </div>

    <!-- Modales HTML Nativos para Géneros -->
    <div class="modal-overlay hidden" id="modal-genero-form">
      <div class="modal-box" style="max-width: 420px;">
        <div class="modal-header">
          <h2 id="modal-genero-title">Crear género</h2>
          <button class="modal-close btn-close-modal">✕</button>
        </div>
        <div class="modal-body">
          <form class="form" id="form-genero">
            <div id="genero-form-error" class="form-error hidden"></div>

            <label for="genero-nombre">Nombre del género</label>
            <input type="text" id="genero-nombre" placeholder="Ej. battle royale, rpg, deportes..." required />
            <span class="hint-text">Se guardará automáticamente en minúsculas.</span>

            <div class="form-actions">
              <button type="button" class="btn btn-ghost btn-close-modal">Cancelar</button>
              <button type="submit" class="btn btn-primary">Guardar género</button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <!-- Script especifico de la página Géneros -->
    <script type="module" src="/src/pages/generos.js"></script>
  </body>
</html>
