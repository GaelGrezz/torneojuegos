<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Torneo Videojuegos - Dashboard</title>
    <link rel="stylesheet" href="/src/index.css" />
  </head>
  <body>
    <div class="app">
      <nav class="sidebar">
        <a href="index.html" class="sidebar-tab active" title="Dashboard">
          <span class="sidebar-tab-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round">
              <rect x="3" y="3" width="7" height="9" rx="1.5" />
              <rect x="14" y="3" width="7" height="5" rx="1.5" />
              <rect x="14" y="12" width="7" height="9" rx="1.5" />
              <rect x="3" y="16" width="7" height="5" rx="1.5" />
            </svg>
          </span>
        </a>

        <a href="videojuegos.html" class="sidebar-tab" title="Videojuegos">
          <span class="sidebar-tab-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round">
              <path d="M6 9h4M8 7v4" />
              <circle cx="16.5" cy="8.5" r="0.9" fill="currentColor" stroke="none" />
              <circle cx="18.5" cy="10.5" r="0.9" fill="currentColor" stroke="none" />
              <path d="M7.5 6h9a4 4 0 0 1 4 4.2l-.4 4.6a2.6 2.6 0 0 1-4.6 1.5L14 14.5a2 2 0 0 0-1.6-.8h-.8a2 2 0 0 0-1.6.8l-1.5 1.8a2.6 2.6 0 0 1-4.6-1.5l-.4-4.6A4 4 0 0 1 7.5 6Z" />
            </svg>
          </span>
        </a>

        <a href="jugadores.html" class="sidebar-tab" title="Jugadores">
          <span class="sidebar-tab-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round">
              <circle cx="9" cy="8" r="3" />
              <path d="M3.5 20a5.5 5.5 0 0 1 11 0" />
              <path d="M16 8.5a2.8 2.8 0 1 1 0 5.6" />
              <path d="M15.5 14.3c2.4.4 4 2.2 4.5 5.2" />
            </svg>
          </span>
        </a>
      </nav>

      <main class="app-content">
        <section class="page">
          <div class="page-header">
            <h1>Dashboard</h1>
          </div>

          <div class="stats-bar">
            <div class="stat-card">
              <span class="stat-value" id="stat-total-jugadores">0</span>
              <span class="stat-label">Jugadores</span>
            </div>
            <div class="stat-card">
              <span class="stat-value" id="stat-total-juegos">0</span>
              <span class="stat-label">Videojuegos</span>
            </div>
            <div class="stat-card">
              <span class="stat-value" id="stat-total-puntuaciones">0</span>
              <span class="stat-label">Puntuaciones registradas</span>
            </div>
            <div class="stat-card">
              <span class="stat-value" id="stat-promedio-general">0.0</span>
              <span class="stat-label">Puntuación promedio</span>
            </div>
          </div>

          <div class="dashboard-grid">
            <div class="dashboard-card">
              <h3 class="dashboard-card-title">Top jugadores</h3>
              <div id="dashboard-top-players-container"></div>
            </div>
            <div class="dashboard-card">
              <h3 class="dashboard-card-title">Actividad reciente</h3>
              <div id="dashboard-recent-activity-container"></div>
            </div>
          </div>
        </section>
      </main>
    </div>

    <script type="module" src="/src/pages/dashboard.js"></script>
  </body>
</html>
